name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dharmendradockertest/myapp:latest
            dharmendradockertest/myapp:${{ github.sha }}
      - name: Configure Kubernetes API hostname
        run: |
          echo "${{ secrets.KUBE_API_IP }} k8s-master-noble" | sudo tee -a /etc/hosts   
          getent hosts k8s-master-noble
          nc -vz -w 5 k8s-master-noble 6443
      - name: Configure kubectl
        run: |
          - name: Configure kubectl
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - run: |
          if kubectl get deployment test >/dev/null 2>&1; then
            echo "Deployment exists. Updating image..."

            kubectl set image deployment/test \
              myapp=dharmendradockertest/myapp:${{ github.sha }}
          else
            echo "Deployment does not exist. Creating it..."

            kubectl create deployment test \
              --image=dharmendradockertest/myapp:${{ github.sha }}
          fi
